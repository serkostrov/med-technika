# Локальный полный контур: Node-сервис (SPA + API) + Postgres.
#   npm run docker:up  → http://localhost:8080
services:
  web:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VITE_APP_ENV: production
        VITE_API_BASE: /api
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-mt}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-med_technique}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@lab.local}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-change-me-admin}
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-med_technique}
      POSTGRES_USER: ${POSTGRES_USER:-mt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../supabase/migrations/003_app_state.sql:/docker-entrypoint-initdb.d/01_app_state.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
